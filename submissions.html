<!DOCTYPE html>
<html>
<head>
    <title>Submissions</title>
</head>

<body>

<h1>All Submissions</h1>

<ul id="list"></ul>

<script>

let submissions =
JSON.parse(localStorage.getItem("contacts")) || [];

let list =
document.getElementById("list");

submissions.forEach(function(data){

list.innerHTML += `
<li>
${data.name}
-
${data.email}
-
${data.message}
</li>
`;

});

</script>

</body>
</html>
